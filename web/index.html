<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vidcut</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Vidcut</h1>
    <button id="btn-add" class="primary">+ Add clip</button>
    <button id="btn-undo" class="ghost" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
    <button id="btn-redo" class="ghost" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" disabled>↷ Redo</button>
    <button id="btn-queue" class="ghost" title="Show the job queue">Queue <span id="queue-badge" class="badge" hidden></span></button>
    <details class="path-add">
      <summary>Paste a file path instead</summary>
      <input id="path-input" placeholder="C:\Videos\clip.mp4" size="36">
      <button id="btn-add-path">Add</button>
    </details>
    <span class="spacer"></span>
    <div id="status" hidden></div>
    <button id="btn-quit" class="ghost" title="Close Vidcut completely">Quit</button>
  </header>

  <main class="layout">
    <aside class="left">
      <section id="clips-panel" class="panel"></section>
      <section id="covers-panel" class="panel"></section>
      <section id="silence-panel" class="panel"></section>
      <section id="subs-panel" class="panel"></section>
      <section id="highlights-panel" class="panel"></section>
    </aside>
    <section class="center">
      <div class="stage" id="stage">
        <div id="frame">
          <video id="video" playsinline></video>
          <video id="video2" class="standby" playsinline></video>
          <div id="ov-layer"></div>
          <div id="safe-zone"></div>
          <div id="sub-overlay"></div>
        </div>
      </div>
      <div class="transport" id="transport"></div>
    </section>
    <aside class="right">
      <section id="style-panel" class="panel"></section>
      <section id="color-panel" class="panel"></section>
      <section id="queue-panel" class="panel"></section>
      <section id="overlay-panel" class="panel"></section>
      <section id="export-panel" class="panel"></section>
      <section id="episodes-panel" class="panel"></section>
    </aside>
  </main>

  <section class="timelines">
    <div id="cut-strip-wrap"></div>
    <div id="edit-timeline-wrap"></div>
  </section>
  <div id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
